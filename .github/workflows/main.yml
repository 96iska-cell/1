name: AI Website Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Что изменить на сайте?"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Запустить AI-агента
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          python3 ai_agent.py "$PROMPT"

      - name: Сохранить изменения
        run: |
          git config user.name "AI Website Agent"
          git config user.email "ai-agent@users.noreply.github.com"
          git add fbsayt.html
          git commit -m "AI: update website" || echo "No changes"
          git push
